[project]
name = "scotus2vcon"
version = "0.1.0"
description = "Convert Supreme Court oral arguments (via Oyez) to vCon"
requires-python = ">=3.11,<3.13"
dependencies = [
    "vcon>=0.9.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
whisper = ["mlx-whisper>=0.4"]

[project.scripts]
scotus2vcon = "scotus2vcon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scotus2vcon.py"]
